<label class="taon-lang-selector">
  <span class="taon-lang-selector__label">
    {{
      t.gettext('Select Language') +
        ' ' +
        ((isDisabled$ | async) ? t.gettext('(disabled)') : '')
    }}
  </span>

  <!-- currentLang = {{ currentLang | json }} -->

  <select
    class="taon-lang-selector__select"
    [value]="currentLang"
    [disabled]="isDisabled$ | async"
    (change)="changeLanguage($event)">
    @for (lang of availableLangs$ | async; track lang.code) {
      <option
        [value]="lang.code"
        [selected]="lang.code === currentLang">
        {{ lang.label }}
      </option>
    }
  </select>
</label>
