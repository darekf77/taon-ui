<div
  class="yt-container"
  [ngClass]="state"
  [ngStyle]="containerStyle">
  <!-- THUMBNAIL -->
  <div
    *ngIf="!videoActivated()"
    class="yt-preview"
    (click)="onPreviewClick()">
    <!-- @if (isInViewport()) { -->
    <img
      class="yt-media"
      [src]="previewImage()"
      [alt]="displayTitle || 'YouTube video'"
      decoding="async"
      draggable="false"
      (error)="onThumbnailError($event)" />
    <!-- } -->

    <!-- PLAY -->
    <div
      *ngIf="state !== 'preview-picture-locked'"
      class="yt-play-button">
      <mat-icon>play_arrow</mat-icon>
    </div>

    <!-- LOCK -->
    <div
      *ngIf="state === 'preview-picture-locked'"
      class="yt-overlay yt-lock"
      (click)="onLockClick($event)">
      <mat-icon>lock</mat-icon>
    </div>
  </div>

  <!-- ACTUAL YOUTUBE PLAYER -->
  <iframe
    #ytFrame
    *ngIf="videoActivated()"
    class="yt-media"
    [src]="embedUrl()"
    frameborder="0"
    allow="autoplay; encrypted-media; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>

  <!-- PRIVATE OVERLAY -->
  <div
    *ngIf="
      videoActivated() &&
      state === 'video-preview-private' &&
      allowedToBeDisplayedVideoOveraly()
    "
    class="yt-overlay-video"
    (contextmenu)="onRightClick($event)"
    (dblclick)="clicked($event)"
    (click)="clicked($event)">
    <h1 class="text-center">
      Thanks for buying<br />
      this video
    </h1>
  </div>
</div>

<div
  class="yt-title"
  *ngIf="displayTitle">
  {{ displayTitle }}
</div>
