<div class="taon-kv-authorization">
  <div *ngIf="loading()">{{ infoMsg() }}</div>

  <div *ngIf="!loading()">
    <div
      *ngIf="authorizedCount() === 0"
      translate>
      You did not purchase any products
    </div>

    <div *ngIf="authorizedCount() > 0">
      {{
        t.gettext('You purchased [[ count ]] product(s)', {
          count: authorizedCount(),
        })
      }}
    </div>
  </div>
</div>
