<div class="absolute top-2 right-2">
  <button
    mat-icon-button
    aria-label="Close dialog"
    (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</div>
<div class="p-4">
  <h3 class="bold" translate>Language Settings</h3>
  <taon-lang-selector />

  <br />
  <hr />
  <br />
  <h3 class="bold">
    {{ t.gettext('Theme settings') }}
    {{ taonTheme.pernamentMode ? t.gettext("Settings can't ba changed") : '' }}
  </h3>

  <mat-slide-toggle
    class="p-2"
    [checked]="taonTheme.isAuto()"
    [disabled]="taonTheme.pernamentMode"
    (change)="taonTheme.toogleAuto($event.checked)">
    {{ t.gettext('Sync colors with system') }}
  </mat-slide-toggle>

  <mat-slide-toggle
    class="p-2"
    [checked]="taonTheme.isDark()"
    [disabled]="taonTheme.isAuto() || taonTheme.pernamentMode"
    (change)="taonTheme.setDark($event.checked)">
    {{ t.gettext('Dark mode') }}
  </mat-slide-toggle>
</div>
