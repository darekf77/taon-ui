<div class="absolute top-2 right-2">
  <button
    mat-icon-button
    aria-label="Close dialog"
    (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</div>
<div class="auth-dialog p-5">
  <h4
    class="mb-3"
    translate>
    Login or Register
  </h4>

  <div
    class="w-full pt-3"
    #emailLoginBtn>
    <form
      [formGroup]="form"
      (ngSubmit)="loginByEmail()"
      class="w-full">
      <mat-form-field
        appearance="outline"
        class="w-full email-field">
        <mat-label *ngIf="!diableLoginByEmail">Email</mat-label>

        <input
          matInput
          formControlName="email"
          class="pl-1"
          type="email"
          [placeholder]="
            diableLoginByEmail ? t.gettext('Login by email (disabled)') : ''
          " />

        <button
          mat-icon-button
          [disabled]="diableLoginByEmail"
          matSuffix
          color="primary">
          <mat-icon>mail</mat-icon>
        </button>
        <mat-error
          *ngIf="
            form.get('email')?.hasError('pattern') && form.get('email')?.touched
          "
          translate>
          Please enter a valid email address
        </mat-error>

        <mat-error
          *ngIf="
            form.get('email')?.hasError('required') &&
            form.get('email')?.touched
          ">
          {{ t.gettext('Email is') }} <strong translate>required</strong>
        </mat-error>
      </mat-form-field>
    </form>

    <div class="divider">
      <span translate>or</span>
    </div>

    <!-- GOOGLE BUTTON -->
    <div
      #googleBtn
      class="google-container">
      <span
        *ngIf="!googleButtonLoaded"
        class="text-300 p-2"
        translate
        >loading google button..</span
      >
      <mat-progress-bar
        *ngIf="!googleButtonLoaded"
        mode="indeterminate"
        class="auth-progress" />
    </div>

    <!-- MICROSOFT BUTTON -->
    <div
      *ngIf="microsoftClientId"
      #microsoftBtn
      class="microsoft-container">
      <button
        mat-stroked-button
        color="primary"
        class="w-full microsoft-btn"
        (click)="loginWithMicrosoft()">
        <mat-icon class="mr-2">login</mat-icon>
        {{ t.gettext('Continue with Microsoft') }}
      </button>
    </div>
  </div>

  <br />

  <div class="flex justify-content-end">
    <button
      mat-button
      mat-dialog-close>
      {{ t.gettext('Cancel') }}
    </button>
  </div>
</div>
